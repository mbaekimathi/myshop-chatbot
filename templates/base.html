{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="{{ company_name|default:'MY-SHOP' }} — shop-to-shop chat and business data assistant.">
  <link rel="manifest" href="{% static 'manifest.json' %}">
  <meta name="theme-color" content="#00a884">
  <link rel="icon" href="{% static 'img/icon-192.png' %}" type="image/png">
  <link rel="apple-touch-icon" href="{% static 'img/icon-192.png' %}">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#075e54">
  <title>{% block title %}{{ company_name|default:"MY-SHOP" }} Chat{% endblock %}</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem("myshop-theme");
        var theme = stored === "dark" || stored === "light" ? stored : "light";
        document.documentElement.setAttribute("data-theme", theme);
      } catch (e) {
        document.documentElement.setAttribute("data-theme", "light");
      }
    })();
  </script>
  <link rel="preload" href="{% static 'fonts/manrope-latin.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="{% static 'css/chatbot.css' %}?v=41">
  <script src="{% static 'vendor/lucide.min.js' %}" defer></script>
  {% block extra_head %}{% endblock %}
</head>
<body class="{% block body_class %}{% endblock %}">
  {% block body %}{% endblock %}
  {% block extra_js %}{% endblock %}
</body>
</html>
